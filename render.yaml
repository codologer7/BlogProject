services:
  - type: web
    name: blogproject
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn blogproject.wsgi
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blogproject
          property: connectionString

databases:
  - name: blogproject
    plan: free
    ipAllowList: []
